<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FoodHub application preview</title>
  <desc id="desc">A dark FoodHub restaurant browsing preview with navigation, search, food categories, and restaurant cards.</desc>
  <rect width="1200" height="720" rx="24" fill="#0a0a0a"/>
  <rect x="24" y="24" width="1152" height="672" rx="18" fill="#111113" stroke="#292929"/>
  <text x="66" y="78" fill="#f97316" font-family="Arial,sans-serif" font-size="28" font-weight="700">foodhub</text>
  <text x="650" y="78" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">Home</text><text x="730" y="78" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">Foods</text><text x="810" y="78" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="15">Restaurants</text>
  <rect x="1010" y="50" width="110" height="38" rx="19" fill="#f97316"/><text x="1065" y="75" fill="#fff" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="700">Sign in</text>
  <rect x="66" y="122" width="1068" height="210" rx="18" fill="#24170f"/>
  <circle cx="1010" cy="165" r="140" fill="#f9731622"/><circle cx="1080" cy="290" r="110" fill="#f9731616"/>
  <text x="112" y="178" fill="#fb923c" font-family="Arial,sans-serif" font-size="13" font-weight="700">FAST DELIVERY IN TOWN</text>
  <text x="112" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Delicious food,</text><text x="112" y="265" fill="#f97316" font-family="Arial,sans-serif" font-size="38" font-weight="700">delivered fast.</text>
  <rect x="112" y="285" width="170" height="34" rx="17" fill="#f97316"/><text x="197" y="307" fill="#fff" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="700">Order now →</text>
  <text x="66" y="380" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Explore by category</text>
